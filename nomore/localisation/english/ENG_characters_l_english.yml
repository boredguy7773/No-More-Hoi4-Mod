ENG_boris_johnson_desc:0 "A flamboyant politician with an unmistakable mop of blond hair, Alexander Boris de Pfeffel Johnson rose to become Prime Minister of the United Kingdom in July 2019. A leading figure of the Conservative Party and one of the most prominent advocates of Brexit, Johnson entered Downing Street promising to finally deliver the country's departure from the European Union. By 2020, Johnson's government finds itself facing an extraordinary combination of crises. Britain has formally left the European Union, yet the question of what Britain's future relationship with Europe will look like remains unresolved. At home, divisions over Brexit continue to dominate politics, while Scotland's demands for another independence referendum and tensions within the United Kingdom threaten the country's unity. Known for his populist rhetoric, optimistic public persona and willingness to take political risks, Johnson presents himself as a leader capable of restoring Britain's confidence and making the country a more independent global power. His critics, however, accuse him of recklessness, dishonesty and placing political spectacle above competent government. With Britain's future hanging in the balance, Boris Johnson must now prove whether his vision of a newly independent Global Britain can survive the immense political, economic and social challenges of the new decade."