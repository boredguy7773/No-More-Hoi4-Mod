ENG_boris_johnson_desc:0 "A master of theatrical populism and classical rhetoric, Alexander Boris de Pfeffel Johnson combines relentless ambition with a famously chaotic persona. Rising through the ranks of journalism and municipal politics, he commands a fiercely loyal following through sheer force of personality and unorthodox charm. Whether he steers the nation through crisis with rousing appeals to British exceptionalism or reshapes the constitutional order to suit his own formidable ambitions, Johnson views history not as a set of rules, but as a stage for his own grand performance."

