NOMORE_BOOKMARK_DESC_LOC:0 "The World will be no more soon."

ENG_NMB_DESC_LOC:0 "The United Kingdom remains a major military, financial, and diplomatic power, but its place in the world is changing. The decision to leave the European Union has divided the country and placed new strain on its economy, its union, and its relationship with its neighbours. As Britain seeks a new role beyond Europe, its government must decide whether it can turn national independence into lasting influence."
IRE_NMB_DESC_LOC:0 "Ireland has transformed from a peripheral European state into a modern, globally connected economy. Its prosperity rests on trade, foreign investment, and strong ties to both the European Union and the United Kingdom. With Brexit threatening to reopen old questions over Northern Ireland, Dublin must protect peace on the island while navigating an uncertain future abroad."
GER_NMB_DESC_LOC:0 "A united Germany stands at the heart of Europe: prosperous, influential, and shaped by the responsibilities of its past. Under Chancellor Angela Merkel, the Federal Republic relies on its export-driven economy, close European partnerships, and cautious diplomacy to preserve stability. Yet political fragmentation, pressure on the European Union, and an underfunded Bundeswehr raise a difficult question: can Germany remain a civilian power in an increasingly dangerous world?"