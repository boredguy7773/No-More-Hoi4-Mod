IRE_micheal_higgins_desc:0 "Michael D. Higgins was the President of Ireland in 2020, serving as the country's head of state since his election in 2011. A long-time Labour Party politician, poet, academic and campaigner, Higgins was known for his strong support of Irish culture, social equality, human rights and the arts. By 2020, he had become a widely recognised and respected figure in Irish public life, although the presidency remained largely ceremonial. During his second term, Higgins focused heavily on Ireland's cultural identity, international relations and social issues while representing the country at home and abroad."
